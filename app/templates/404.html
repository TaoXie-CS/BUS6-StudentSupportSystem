{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
    <div style="text-align: center; margin: 50px 0;">
        <h1 style="font-size: 48px; color: #dc3545;">404</h1>
        <h2 style="margin: 20px 0;">Page Not Found</h2>
        <p style="font-size: 16px; margin-bottom: 30px;">The page you are looking for does not exist or has been moved.</p>
        <a href="{{ url_for('index') }}" style="padding: 8px 16px; background: #007bff; color: white; text-decoration: none; border-radius: 4px;">
            Return to Home Page
        </a>
    </div>
{% endblock %}
